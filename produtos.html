<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - LE BUSINESS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #1a1a1a; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 15px; }
        .produto-card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .produto-card img { width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
        .preco { color: #27ae60; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .btn-comprar { background: #e67e22; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-comprar:active { transform: scale(0.95); }
    </style>
</head>
<body>

<header>
    <h2>LE BUSINESS - Loja</h2>
</header>

<div class="vitrine">
    <!-- Produto 1 -->
    <div class="produto-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis">
        <h3>Tênis Sport</h3>
        <p class="preco">R$ 199,90</p>
        <button class="btn-comprar" onclick="adicionarCarrinho('Tênis Sport')">COMPRAR</button>
    </div>

    <!-- Produto 2 -->
    <div class="produto-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Relógio">
        <h3>Relógio Lux</h3>
        <p class="preco">R$ 350,00</p>
        <button class="btn-comprar" onclick="adicionarCarrinho('Relógio Lux')">COMPRAR</button>
    </div>
</div>

<script>
    function adicionarCarrinho(nome) {
        alert(nome + " foi adicionado ao seu carrinho!");
    }
</script>

</body>
</html>
