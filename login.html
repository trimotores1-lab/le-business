<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LE BUSINESS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2c3e50; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 80%; max-width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <input type="email" placeholder="Seu e-mail">
        <input type="password" placeholder="Sua senha">
        <button onclick="alert('Sistema de login em manutenção!')">ENTRAR</button>
        <br><br>
        <a href="index.html" style="font-size: 12px; color: #7f8c8d;">Voltar ao início</a>
    </div>
</body>
</html>
